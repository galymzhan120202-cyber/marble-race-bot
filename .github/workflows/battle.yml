name: Maze Race Battle Royale Upload

# Battle Royale mode: closed arena, shrinking safe zone, weapon pickups,
# last racer standing wins. Takes the 16:15 KZ slot that used to belong to
# the plain maze race in upload.yml, so total daily Shorts volume is
# unchanged (2 maze race + 1 battle royale per day).

on:
  schedule:
    - cron: '15 11 * * *'   # 16:15 KZ
  workflow_dispatch:        # қолмен де іске қосуға болады

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Кодты алу
        uses: actions/checkout@v4

      - name: Python орнату
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg орнату
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Python кітапханаларын орнату
        run: pip install --quiet -r requirements.txt

      - name: YouTube деректерін қалпына келтіру
        env:
          MRACE_CLIENT_SECRETS_JSON: ${{ secrets.MRACE_CLIENT_SECRETS_JSON }}
          MRACE_YOUTUBE_TOKEN_JSON: ${{ secrets.MRACE_YOUTUBE_TOKEN_JSON }}
        run: |
          echo "$MRACE_CLIENT_SECRETS_JSON" > client_secrets.json
          echo "$MRACE_YOUTUBE_TOKEN_JSON" > youtube_token.json

      - name: .env файлын құру
        run: |
          cat > .env << 'EOF'
          TELEGRAM_NOTIFY_TOKEN=${{ secrets.MRACE_TELEGRAM_NOTIFY_TOKEN }}
          TELEGRAM_NOTIFY_CHAT_ID=${{ secrets.MRACE_TELEGRAM_NOTIFY_CHAT_ID }}
          BATTLE_MIN_SECONDS=14
          BATTLE_MAX_SECONDS=32
          MUSIC_VOLUME=0.15
          SFX_VOLUME=0.9
          YOUTUBE_CATEGORY_ID=20
          YOUTUBE_PRIVACY_STATUS=public
          YOUTUBE_MADE_FOR_KIDS=false
          VIDEO_CODEC=libx264
          AUDIO_CODEC=aac
          BATTLE_VIDEO_FPS=60
          VIDEO_PRESET=ultrafast
          BATTLE_VIDEO_WIDTH=1080
          BATTLE_VIDEO_HEIGHT=1920
          MAX_RETRIES=3
          RETRY_DELAY=2
          EOF

      - name: Видео құру және YouTube-ке жүктеу
        run: python -c "from battle_gen import generate_battle_video; generate_battle_video()"
